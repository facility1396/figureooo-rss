name: Build RSS feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate figure.ooo title-and-thumbnail RSS
        env:
          SOURCE_FEED: https://figure.ooo/feed.xml
          PUBLIC_FEED_URL: https://facility1396.github.io/figureooo-rss/feed.xml
          OUTPUT: public/feed.xml
        run: python scripts/build_feed.py

      - name: Generate Daiki Kogyo RSS
        env:
          PUBLIC_FEED_URL: https://facility1396.github.io/figureooo-rss/daiki/feed.xml
          OUTPUT: public/daiki/feed.xml
          MAX_PAGES: "3"
        run: python scripts/build_daiki_feed.py

      - name: Generate CAMELOT product RSS
        env:
          SOURCE_URL: https://camelot-tokyo.jp/product/
          PUBLIC_FEED_URL: https://facility1396.github.io/figureooo-rss/camelot/feed.xml
          OUTPUT: public/camelot/feed.xml
          MAX_ITEMS: "50"
        run: python scripts/build_camelot_feed.py

      - name: Add landing page
        run: |
          mkdir -p public/daiki public/camelot
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="ja">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>RSS一覧</title>
          <h1>RSS一覧</h1>
          <ul>
            <li><a href="./feed.xml">figure.ooo タイトル・トップ画像RSS</a></li>
            <li><a href="./daiki/feed.xml">ダイキ工業 製品情報RSS</a></li>
            <li><a href="./camelot/feed.xml">CAMELOT 製品情報RSS</a></li>
          </ul>
          </html>
          EOF
          cat > public/daiki/index.html <<'EOF'
          <!doctype html>
          <html lang="ja">
          <meta charset="utf-8">
          <title>ダイキ工業 製品情報RSS</title>
          <h1>ダイキ工業 製品情報RSS</h1>
          <p><a href="./feed.xml">RSSフィードを開く</a></p>
          </html>
          EOF
          cat > public/camelot/index.html <<'EOF'
          <!doctype html>
          <html lang="ja">
          <meta charset="utf-8">
          <title>CAMELOT 製品情報RSS</title>
          <h1>CAMELOT 製品情報RSS</h1>
          <p><a href="./feed.xml">RSSフィードを開く</a></p>
          <p><a href="https://camelot-tokyo.jp/product/">公式製品一覧</a></p>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
